<style>@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap');
:root{--bg:#fff8ed;--ink:#38291d;--muted:#786858;--blue:#e78a16;--blue2:#fff0d5;--line:#f0dfc7;--card:#fff;--accent:#c66b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nanum Gothic", "나눔고딕", system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}aside{background:#fff;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh}
.brand{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.12em}.side-title{font-size:20px;font-weight:800;line-height:1.35;margin:10px 0 22px}

main{padding:clamp(20px,5vw,64px);display:flex;align-items:center;justify-content:center}.slide{width:min(100%,960px);min-height:70vh;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,54px);box-shadow:0 12px 36px #27335a0b;display:flex;flex-direction:column}

.prompt{white-space:pre-wrap;background:#111827;color:#f4f6fb;padding:20px;border-radius:14px;line-height:1.65;font-size:15px;overflow-wrap:anywhere;margin:18px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}button.action,.pill{border:0;border-radius:11px;background:var(--blue);color:white;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.secondary{background:#eef1f7;color:var(--ink)}button.action:active{transform:scale(.98)}.copy-status{color:var(--accent);font-weight:700;min-height:22px}
select,input{font:inherit;border:1px solid var(--line);background:white;border-radius:10px;padding:12px;width:100%;color:var(--ink)}.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.topic-picker,.idea-picker{min-width:0}.field-label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.chosen{background:var(--blue2);color:var(--blue);padding:12px;border-radius:12px;margin-top:12px;font-weight:700}

.teacher-panel{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fffdfa;font-size:13px;line-height:1.5}
.teacher-heading{font-weight:800;color:#a85c09;margin-bottom:8px}.teacher-status{color:var(--muted);margin:6px 0 10px;overflow-wrap:anywhere}.teacher-form{display:grid;gap:7px}.teacher-form input{margin-bottom:5px}.teacher-form button{width:100%;margin-top:5px}.uid-text{font-size:11px;overflow-wrap:anywhere;color:var(--muted);margin:8px 0}.room-info{margin-top:10px;color:var(--muted)}.student-status{margin-top:16px;padding:10px;border-radius:10px;background:#eef7ff;color:#245b83;font-size:12px}.teacher-panel[hidden],#teacherLoggedIn[hidden],#studentStatus[hidden]{display:none!important}

1. 역할 및 목표 (Role & Goal)
당신은 최고의 이커머스 마케터이자 시각화 전문가(Visualization Expert)입니다. 입력된 텍스트를 분석하여 문단별 16:9 비율의 [현장감 있는 실제 사진 기반 이미지]와 최종 1:1 비율의 [블로그 대표 썸네일]을 제작하고, 이를 컬렉션(Collection)으로 완벽하게 정리하여 제공합니다.

* 핵심 문구 추출: 각 문단의 맥락을 관통하면서 이미지 내에 자연스럽게 녹여낼 '핵심 한국어 타이틀(15자 이내)'을 추출합니다.
* 언어 원칙: 모든 분석, 파일명, 이미지 내 텍스트는 반드시 한국어로만 제작합니다.

3. 이미지 생성 세부 규칙 (강력 준수 사항)
* 언어 통제 (Language Control): 이미지 내에 텍스트를 포함할 경우, 절대로 영어를 사용하지 마십시오. 모든 단어, 숫자 단위, 라벨은 반드시 한국어로만 표현합니다.
* 실제 사진 스타일 (Photo-realistic Style):
  - 그래픽이나 일러스트 요소를 배제하고, 실제 DSLR 카메라로 촬영한 듯한 고품질 실제 사진(High-Quality Real-life Photography) 스타일을 적용합니다.
  - 자연광(Natural Lighting)과 사실적인 질감을 강조하여, 네이버 AI 필터가 선호하는 '직접 촬영한 듯한 현장감'을 구현합니다.
* 텍스트 시인성 및 배치 (Readability & Layout):
  - 사진의 빈 공간(Negative Space)이나 여백을 활용하여 텍스트를 배치합니다.
  - 복잡한 사진 배경으로 인해 글자가 묻힐 경우, 글자 주변에 은은한 그림자(Drop Shadow)를 주거나 글자 배경에 투명도 30~50%의 부드러운 내추럴 블러 패드(Natural Blur Pad)를 적용하여 가독성을 극대화합니다.
  - 폰트는 가독성이 높은 두꺼운 고딕 또는 본고딕 계열의 한국어 대형 폰트를 사용합니다.
* 규격 및 분량: 모든 문단에 대해 16:9 비율로 각 1개씩 제작하며, 프로세스가 모두 끝난 후 전체 포스팅의 주제를 상징하는 1:1 비율의 고해상도 대표 썸네일을 1개 제작합니다.
* 파일명 규칙 (Naming Rule):
  - 형식: {두자리숫자}_{주제} (예: 00_스마트스토어_정석, 썸네일_마케팅_전략)
  - 날짜 기입 금지, 영문 파일명 사용 금지.
  - 생성 직후 rename_workflow를 사용하여 파일명을 즉시 한국어로 수정합니다.

let current=0;
const nav=document.getElementById('nav');
pages.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML=`<span>${i===0?'INTRO':i===7?'FINISH':'STEP '+(i)}</span>${p.title}`;b.onclick=()=>go(i);nav.appendChild(b)});
function go(i, fromRemote=false){
 if((isStudent || (teacherMode && !teacherUser)) && !fromRemote) return;
 current=Math.max(0,Math.min(pages.length-1,i));
 document.getElementById('slide').innerHTML=`<div class="kicker">${pages[current].kicker}</div><h1>${pages[current].title}</h1><h2>${pages[current].subtitle}</h2>${pages[current].body}<div class="footer"><div class="footnote">${isStudent?'강사가 슬라이드를 이동하면 화면이 자동으로 바뀝니다.':'키보드 ← → 로도 이동할 수 있어요'}</div><div class="controls"><button onclick="go(current-1)" ${current===0 || isStudent || (teacherMode && !teacherUser)?'disabled':''}>← 이전</button><button class="next" onclick="go(current+1)" ${current===pages.length-1 || isStudent || (teacherMode && !teacherUser)?'disabled':''}>다음 →</button></div></div>`;
 nav.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===current));
 document.getElementById('progressText').textContent=`${current+1} / ${pages.length}`;
 document.getElementById('progressBar').style.width=`${(current+1)/pages.length*100}%`;
 window.scrollTo({top:0,behavior:'smooth'});if(current===2)initializeTopics();
 if(!fromRemote && teacherMode && teacherUser && roomRef){roomRef.child('slide').set(current).catch(showFirebaseError)}
}
function copyText(id,btn){let txt=document.getElementById(id).innerText; navigator.clipboard.writeText(txt).then(()=>{const old=btn.textContent;btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent=old,1600)}).catch(()=>{const area=document.createElement('textarea');area.value=txt;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent='프롬프트 복사',1600)})}
function initializeTopics(){const s=document.getElementById('topic');if(s.options.length>1)return;topics.forEach(t=>{let o=document.createElement('option');o.value=t.id;o.textContent=t.name;s.appendChild(o)})}
function updateIdeas(){const t=topics.find(x=>x.id===Number(document.getElementById('topic').value));const s=document.getElementById('idea');s.innerHTML='<option value="">세부 글감을 선택하세요</option>';if(t){t.ideas.forEach((idea,i)=>{let o=document.createElement('option');o.value=idea;o.textContent=`${i+1}. ${idea}`;s.appendChild(o)});const m=document.getElementById('materials');m.style.display='block';m.innerHTML='<b>준비하면 좋은 자료</b><br>'+t.materials}else document.getElementById('materials').style.display='none';updatePrompt()}
function updatePrompt(){const custom=document.getElementById('customTopic').value.trim();const selected=document.getElementById('idea').value;const subject=custom||selected;document.getElementById('chosen').style.display=subject?'block':'none';document.getElementById('chosen').textContent=subject?'선택한 글감: '+subject:'';document.getElementById('p2').textContent=subject?`[${subject}]을 주제로 글을 작성해주세요.`:'세부 글감을 선택하거나 직접 입력하면 프롬프트가 여기에 표시됩니다.'}

function setTeacherStatus(message,isError=false){teacherStatus.textContent=message;teacherStatus.style.color=isError?'#b42318':'var(--muted)';}
function showFirebaseError(error){console.error(error);const msg=(error&&error.code==='PERMISSION_DENIED')?'권한 거부(permission_denied): Realtime Database 규칙의 UID가 로그인한 강사 UID와 같은지 확인하세요.':(error&&error.message)||'Firebase 연결 중 오류가 발생했습니다.';if(teacherMode)setTeacherStatus(msg,true);if(isStudent)studentStatus.textContent=msg;}
function setTeacherUi(user){
 teacherUser=user||null;
 if(!teacherMode)return;
 document.body.classList.toggle('readonly',!teacherUser);
 teacherLoginForm.hidden=!!teacherUser;teacherLoggedIn.hidden=!teacherUser;
 if(teacherUser){document.getElementById('teacherUid').textContent='로그인 UID: '+teacherUser.uid+' (이 UID를 Firebase 규칙의 강사 UID와 일치시켜야 합니다)';setTeacherStatus('로그인 완료. 수업 슬라이드를 조작할 수 있습니다.');}
 else setTeacherStatus('강사 이메일과 비밀번호로 로그인하세요.');
 go(current,true);
 if(teacherUser && roomRef){roomRef.child('slide').once('value').then(s=>{if(s.exists())go(Number(s.val())||0,true);else roomRef.child('slide').set(current).catch(showFirebaseError);}).catch(showFirebaseError);}
}
function startFirebase(){
 try{
  if(!window.LECTURE_CONFIG||!window.LECTURE_CONFIG.firebase)throw new Error('js/config.js의 window.LECTURE_CONFIG.firebase 설정을 찾을 수 없습니다.');
  if(!window.firebase)throw new Error('Firebase SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  const config=window.LECTURE_CONFIG.firebase;
  if(!config.apiKey||!config.authDomain||!config.databaseURL||!config.projectId||!config.appId)throw new Error('config.js의 Firebase 설정값 5개를 모두 확인하세요.');
  if(!firebase.apps.length)firebase.initializeApp(config);
  const auth=firebase.auth();firebaseDb=firebase.database();roomRef=firebaseDb.ref('rooms/'+roomCode);
  if(teacherMode){setTeacherStatus('Firebase 연결됨. 강사 로그인을 기다립니다.');auth.onAuthStateChanged(user=>setTeacherUi(user),showFirebaseError);}
  if(isStudent){roomRef.child('slide').on('value',snapshot=>{if(snapshot.exists()){const n=Number(snapshot.val());if(Number.isInteger(n))go(n,true);studentStatus.textContent='학생 모드 · 수업 연결됨 · '+roomCode;}else studentStatus.textContent='학생 모드 · 강사가 수업을 시작하기를 기다리는 중';},showFirebaseError);}
  teacherLoginForm.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('teacherEmail').value.trim();const password=document.getElementById('teacherPassword').value;const button=teacherLoginForm.querySelector('button');button.disabled=true;button.textContent='로그인 중…';try{await auth.signInWithEmailAndPassword(email,password);}catch(error){setTeacherStatus(error.code==='auth/invalid-credential'?'이메일 또는 비밀번호를 확인하세요.':error.message,true);}finally{button.disabled=false;button.textContent='강사 로그인';}});
  document.getElementById('teacherLogout').addEventListener('click',()=>auth.signOut().catch(showFirebaseError));
 }catch(error){showFirebaseError(error);}
}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
go(0,true);startFirebase();
